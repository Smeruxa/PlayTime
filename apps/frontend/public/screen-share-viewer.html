<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; object-src 'none'; base-uri 'none'; form-action 'none'"
        />
        <title>Демонстрация экрана</title>
        <link rel="stylesheet" href="scrollbars.css" />
        <link rel="stylesheet" href="screen-share-viewer.css" />
    </head>
    <body>
        <img id="frame" alt="Демонстрация экрана" />
        <div id="overlay" class="visible">
            <section id="mixer" role="dialog" aria-labelledby="mixerTitle" hidden>
                <header>
                    <h1 id="mixerTitle">Звук демонстрации</h1>
                    <button type="button" id="hideMixer" class="iconButton" aria-label="Закрыть микшер">×</button>
                </header>
                <div id="mainChannels"></div>
                <p id="emptyMixer" class="hint">Настройки появятся после подключения к звонку</p>
            </section>
            <nav class="toolbar" aria-label="Управление демонстрацией">
                <button
                    type="button"
                    id="mixerToggle"
                    class="toolbarButton"
                    aria-expanded="false"
                    aria-controls="mixer"
                    title="Громкость демонстрации"
                    aria-label="Громкость демонстрации"
                >
                    <svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7"
                        aria-hidden="true"
                    >
                        <path d="M4 4v16M12 4v16M20 4v16" />
                        <path d="M1 9h6M9 16h6M17 8h6" stroke-width="4" />
                    </svg>
                </button>
                <span class="separator" aria-hidden="true"></span>
                <button
                    type="button"
                    id="closeBtn"
                    class="toolbarButton"
                    title="Выйти из полного экрана · Esc"
                    aria-label="Выйти из полного экрана"
                >
                    <svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7"
                        aria-hidden="true"
                    >
                        <path d="M9 3v6H3m18 0h-6V3M3 15h6v6m6 0v-6h6" />
                    </svg>
                </button>
            </nav>
        </div>
        <script src="screen-share-viewer.js"></script>
    </body>
</html>
