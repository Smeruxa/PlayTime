location ^~ /playtime/feedback-api/ {
    limit_req zone=playtime_feedback_ip burst=10 nodelay;
    limit_req zone=playtime_feedback_global burst=20 nodelay;
    limit_req_status 429;
    limit_conn playtime_feedback_conn 5;
    limit_conn_status 429;
    error_page 429 = @playtime_feedback_limited;
    client_max_body_size 24k;
    client_body_timeout 10s;
    proxy_request_buffering on;
    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_pass http://127.0.0.1:1501;
}
location @playtime_feedback_limited {
    default_type application/json;
    add_header Retry-After 60 always;
    add_header Cache-Control no-store always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 429 '{"error":"Запросов слишком много. Попробуйте через минуту.","retryAfter":60}';
}
