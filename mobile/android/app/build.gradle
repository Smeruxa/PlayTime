apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def releaseStorePath = providers.environmentVariable("PLAYTIME_ANDROID_KEYSTORE").orNull
def rustoreProjectOverride = providers.environmentVariable("PLAYTIME_RUSTORE_PROJECT_ID")
def rustoreProjectId = rustoreProjectOverride
    .orElse(providers.gradleProperty("playtimeRustoreProjectId"))
    .getOrElse("")
def debugRustoreProjectId = rustoreProjectOverride.getOrElse("")
if (!([rustoreProjectId, debugRustoreProjectId].every { it ==~ /[a-zA-Z0-9_-]*/ })) {
    throw new GradleException("PLAYTIME_RUSTORE_PROJECT_ID contains unsupported characters")
}

def debugApiBase = providers.gradleProperty("playtimeApiBase").getOrElse("https://playtime.smeruxa.ru/playtime")
def debugSocketUrl = providers.gradleProperty("playtimeSocketUrl").getOrElse("https://playtime.smeruxa.ru")

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion
    namespace "com.playtimemobile"

    defaultConfig {
        applicationId "com.playtimemobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 20021
        versionName "2.0.21"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "API_BASE", '"https://playtime.smeruxa.ru/playtime"'
        buildConfigField "String", "SOCKET_URL", '"https://playtime.smeruxa.ru"'
        buildConfigField "String", "RUSTORE_PROJECT_ID", '"' + rustoreProjectId + '"'
        resValue "bool", "playtime_push_enabled", rustoreProjectId.isEmpty() ? "false" : "true"
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        if (releaseStorePath) {
            release {
                storeFile file(releaseStorePath)
                storePassword providers.environmentVariable("PLAYTIME_ANDROID_STORE_PASSWORD").get()
                keyAlias providers.environmentVariable("PLAYTIME_ANDROID_KEY_ALIAS").get()
                keyPassword providers.environmentVariable("PLAYTIME_ANDROID_KEY_PASSWORD").get()
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            buildConfigField "String", "API_BASE", '"' + debugApiBase + '"'
            buildConfigField "String", "SOCKET_URL", '"' + debugSocketUrl + '"'
            buildConfigField "String", "RUSTORE_PROJECT_ID", '"' + debugRustoreProjectId + '"'
            resValue "bool", "playtime_push_enabled", debugRustoreProjectId.isEmpty() ? "false" : "true"
        }
        release {
            if (releaseStorePath) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        preview {
            initWith release
            applicationIdSuffix ".preview"
            signingConfig signingConfigs.debug
            matchingFallbacks = ["release"]
            buildConfigField "String", "RUSTORE_PROJECT_ID", '"' + debugRustoreProjectId + '"'
            resValue "bool", "playtime_push_enabled", debugRustoreProjectId.isEmpty() ? "false" : "true"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
    implementation("androidx.exifinterface:exifinterface:1.4.2")
    implementation("ru.rustore.sdk:pushclient:7.5.0")
    androidTestImplementation("androidx.test:runner:1.7.0")
    androidTestImplementation("androidx.test:rules:1.7.0")
    androidTestImplementation("androidx.test.ext:junit:1.3.0")
}
