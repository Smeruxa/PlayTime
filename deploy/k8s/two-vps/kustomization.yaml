apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
    - ../base
    - volumes.yaml
    - disruption-budgets.yaml
patches:
    - path: domain-rollout.yaml
      target:
          kind: StatefulSet
          name: playtime-(chat|room)-api
    - target:
          kind: Service
          name: playtime-pods
      patch: |-
          - op: add
            path: /spec/publishNotReadyAddresses
            value: true
    - target:
          kind: StatefulSet
          name: playtime-(gateway|auth-api|chat-api|room-api)
      patch: |-
          - op: add
            path: /spec/template/spec/nodeSelector
            value: {playtime.io/node: primary}
    - target:
          kind: PersistentVolumeClaim
      patch: |-
          - op: add
            path: /spec/storageClassName
            value: ""
    - target:
          kind: PersistentVolumeClaim
          name: playtime-chat-media
      patch: |-
          - op: add
            path: /spec/volumeName
            value: playtime-primary-media
    - target:
          kind: PersistentVolumeClaim
          name: playtime-releases
      patch: |-
          - op: add
            path: /spec/volumeName
            value: playtime-primary-releases
    - target:
          kind: StatefulSet
          name: playtime-chat-api
      patch: |-
          - op: replace
            path: /spec/template/spec/containers/0/env/1/value
            value: /app/apps/data/voices
images:
    - name: playtime-gateway
      newTag: dual-20261124-1
    - name: playtime-auth-api
      newTag: dual-20261124-1
    - name: playtime-chat-api
      newTag: dual-20261124-1
    - name: playtime-room-api
      newTag: dual-20261124-1
