apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: playtime-chat-media
spec:
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: playtime-releases
spec:
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 20Gi
