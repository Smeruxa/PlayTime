apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: playtime-auth-ingress
spec:
    podSelector:
        matchLabels:
            app.kubernetes.io/name: playtime-auth-api
    policyTypes:
        - Ingress
    ingress:
        - from:
              - podSelector:
                    matchExpressions:
                        - key: app.kubernetes.io/name
                          operator: In
                          values:
                              - playtime-gateway
                              - playtime-chat-api
          ports:
              - protocol: TCP
                port: 1511
---
