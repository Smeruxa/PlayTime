apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: statefulset
spec:
    serviceName: playtime-pods
    replicas: 1
    revisionHistoryLimit: 2
    template:
        spec:
            automountServiceAccountToken: false
            enableServiceLinks: false
            terminationGracePeriodSeconds: 25
            securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                fsGroup: 1000
                fsGroupChangePolicy: OnRootMismatch
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: app
                  imagePullPolicy: IfNotPresent
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                          drop:
                              - ALL
                  resources:
                      requests:
                          cpu: 100m
                          memory: 128Mi
                      limits:
                          memory: 512Mi
                  volumeMounts:
                      - name: tmp
                        mountPath: /tmp
            volumes:
                - name: tmp
                  emptyDir:
                      sizeLimit: 128Mi
